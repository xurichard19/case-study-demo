name: dispatch-case-study

services:
  backend:
    image: dispatch-case-study-backend
    container_name: dispatch-case-study-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TOMTOM_API_KEY: ${TOMTOM_API_KEY:-}
      DAILY_REPORT_MODEL: ${DAILY_REPORT_MODEL:-gpt-4o}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
