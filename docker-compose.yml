name: dispatch-case-study

services:
  backend:
    image: dispatch-case-study-backend
    container_name: dispatch-case-study-backend
    build:
      context: ./backend
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
